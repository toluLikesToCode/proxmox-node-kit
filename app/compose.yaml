# A change here on the `live` branch is deployed within 15 minutes (see update.sh).
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: https://openrouter.ai/api/v1
      ENABLE_OLLAMA_API: "false"
      # Open WebUI keeps the settings below in its database after the first start, so these only
      # seed a fresh install; advisor/sync.sh applies them to an existing one.
      DEFAULT_MODELS: homelab-advisor
      ENABLE_API_KEYS: "true"
      ENABLE_TITLE_GENERATION: "true"
      TASK_MODEL_EXTERNAL: openai/gpt-oss-20b
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      RAG_TOP_K: "15"
      CHUNK_SIZE: "1024"
      CHUNK_OVERLAP: "100"
      ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER: "true"
      ENABLE_RAG_HYBRID_SEARCH: "false"
    volumes:
      - /srv/open-webui:/app/backend/data
